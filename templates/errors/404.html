{% extends "base.html" %}

{% block content %}
<section style="min-height: 70vh; display: flex; align-items: center; justify-content: center; text-align: center; padding-top: 8rem;">
    <div class="container">
        <div style="font-family: var(--font-heading); font-size: 6rem; font-weight: 800; background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">404</div>
        <h1 style="font-size: 2rem; margin-bottom: 1rem;">Page Not Found</h1>
        <p style="color: var(--text-muted); max-width: 480px; margin: 0 auto 2rem;">The page you are looking for doesn't exist or has been moved to another URL.</p>
        <a href="{{ url_for('home') }}" class="btn btn-primary">&larr; Return Home</a>
    </div>
</section>
{% endblock %}
